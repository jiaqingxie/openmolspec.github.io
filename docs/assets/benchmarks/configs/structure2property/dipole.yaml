experiment:
  name: equiformer-v3-dipole
  release: demo-10k
  variant: dipole
  seed: 624

task:
  family: structure2property
  modality: 3d
  targets:
    - dipole_total

model:
  name: equiformer_v3
  parameters: {}

data:
  root: benchmark_data/demo_10k

training:
  epochs: 20
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  workers: 4
  progress: tqdm
  progress_interval_seconds: 30
  device: cuda:0
  gpus: 1

output:
  root: runs
