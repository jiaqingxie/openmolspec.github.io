# Controlled 1M ablation: IR -> IR+Raman -> IR+Raman+1H NMR -> H/C NMR.
# Fixed optimizer-step budget; batch sizes are per GPU.
experiment:
  name: vib2mol-ir-raman-h-generation
  release: openmolspec-v1-ks1000k
  variant: ir-raman-h-generation-v1
  seed: 624
task:
  family: spectrum2structure
  modality: ir-raman-hnmr
  targets: [kekule_smiles]
model:
  name: vib2mol
  stage: pipeline
  use_formula: false
  smiles_augment: true
  spectra_augment: false
  frozen_encoder: false
data:
  root: benchmark_data/release_v1_ks1000k_hc_nmr_minmax
training:
  max_steps: 312500
  eval_every_steps: 2500
  batch_size: 64
  learning_rate: 1.0e-4
  generation_max_steps: 312500
  generation_batch_size: 64
  generation_learning_rate: 1.0e-4
  workers: 0
  device: cuda
  gpus: 4
output:
  root: runs
