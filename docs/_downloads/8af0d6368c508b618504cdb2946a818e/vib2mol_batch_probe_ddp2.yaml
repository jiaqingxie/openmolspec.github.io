# Memory probe, not a scientific benchmark. Batch sizes are PER GPU.
# Debug copies only a subset; passing this probe does not prove full-data safety.
experiment:
  name: vib2mol-batch-probe-ddp2
  release: release-v1
  variant: ir-raman-batch-probe-ddp2-minmax
  seed: 624
task:
  family: spectrum2structure
  modality: ir-raman-nmr
  targets: [kekule_smiles]
model:
  name: vib2mol
  stage: pipeline
  use_formula: false
  smiles_augment: true
  spectra_augment: false
  frozen_encoder: false
data:
  root: benchmark_data/release_v1_ks200k_hc_nmr_minmax
training:
  max_steps: 312500
  eval_every_steps: 2500
  batch_size: 64
  learning_rate: 1.0e-4
  generation_max_steps: 312500
  generation_batch_size: 64
  generation_learning_rate: 1.0e-4
  workers: 0
  device: cuda
  gpus: 2
  progress: tqdm
debug:
  enabled: true
  train_samples: 4096
  eval_samples: 1024
  test_samples: 1024
output:
  root: runs
